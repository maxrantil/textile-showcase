# ABOUTME: Commit quality check - analyzes commits for fixup patterns and suggests cleanup

name: Commit Quality Check

on:
  pull_request:
    branches: [master]

# Default for jobs without their own permissions block (Issue #465)
permissions:
  contents: read

jobs:
  check-commit-quality:
    permissions:
      pull-requests: write
      contents: read
    uses: maxrantil/.github/.github/workflows/commit-quality-check-reusable.yml@0075ab50113bff0183eeefcc15b6968f07df660e # master 2026-11-09
    with:
      base-branch: 'master'
      fail-on-fixups: false
      suggest-cleanup: true
      cleanup-score-threshold: 'MEDIUM'
