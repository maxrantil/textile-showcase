name: Security Monitoring

on:
  schedule:
    # Run every Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual runs
  push:
    branches:
      - master # Run after deployments to track security status

# Default for jobs without their own permissions block (Issue #465)
permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # the failure step opens or comments on the tracking issue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run comprehensive security audit
        id: audit
        continue-on-error: true
        run: |
          echo "🔍 Running comprehensive security audit..."
          echo "================================================"

          # Run npm audit and capture output
          npm audit --json > audit-report.json || true

          # Extract key metrics
          echo "📊 Security Audit Summary:"
          echo "=========================="

          # Count vulnerabilities by severity
          npm audit 2>/dev/null | grep -E "found|Low|Moderate|High|Critical" || true

          echo ""
          echo "📝 Detailed vulnerability breakdown:"
          npm audit --audit-level low || true

      - name: Check for available fixes
        continue-on-error: true
        run: |
          echo "🔧 Checking for available fixes..."
          echo "==================================="

          # Check if automatic fixes are available
          if npm audit fix --dry-run 2>&1 | grep -q "fixed"; then
            echo "✅ Automatic fixes available via 'npm audit fix'"
            echo "Run 'npm audit fix' to apply non-breaking security updates"
          else
            echo "⚠️ No automatic fixes available"
            echo "Manual intervention required for breaking changes"
          fi

      - name: Generate security report
        if: always()
        run: |
          echo "📄 Generating security report..."

          cat > security-report.md << 'EOF'
          # Security Audit Report

          **Date**: $(date)
          **Branch**: master
          **Action**: Scheduled security monitoring

          ## Summary

          This report tracks security vulnerabilities in project dependencies.

          ### Known Issues (Upstream)

          These vulnerabilities are in upstream dependencies and cannot be directly fixed:

          1. **min-document** - Prototype pollution (Sanity dependency)
          2. **Next.js 15.x** - Various moderate vulnerabilities
          3. **tar-fs** - Symlink validation bypass

          ### Tracking

          All security issues are tracked in [Issue #45](https://github.com/maxrantil/textile-showcase/issues/45)

          ### Recommendations

          1. Monitor upstream projects for fixes
          2. Apply non-breaking updates when available via `npm audit fix`
          3. Evaluate risk vs. functionality for breaking changes
          4. Consider alternative packages if vulnerabilities persist

          ---

          *Generated automatically by GitHub Actions*
          EOF

          echo "✅ Security report generated: security-report.md"

      # Fails the run on high/critical production advisories that
      # .github/audit-exceptions.json does not cover (Issue #460, audit SEC-09)
      - name: Audit gate
        run: node scripts/audit-gate.js

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-report-${{ github.run_number }}
          path: |
            audit-report.json
            security-report.md
          retention-days: 30

      - name: Open or update the tracking issue
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = 'Weekly npm audit gate failing'
            const today = new Date().toISOString().split('T')[0]
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body =
              `## 🔍 Security scan ${today}\n\n` +
              `The audit gate or an earlier step failed: [run](${runUrl}).\n\n` +
              `Fix the dependency, or add a reviewed entry with a reason and a near expiry date to ` +
              `\`.github/audit-exceptions.json\`.`

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = open.find((i) => i.title === title && !i.pull_request)
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              })
              console.log(`Commented on #${existing.number}`)
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
              console.log(`Opened #${issue.number}`)
            }
