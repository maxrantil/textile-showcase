# ABOUTME: Unit test workflow with Jest coverage reporting to Codecov

name: Unit Tests

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

# Cancel previous runs when new commits are pushed to the same PR
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

# No job calls the GitHub API (Issue #462, audit SEC-08)
permissions:
  contents: read

jobs:
  unit-tests:
    name: Run Jest Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch full history for accurate coverage comparison
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails on lint errors; warnings are reported but allowed
      - name: Lint
        run: npm run lint

      # High/critical production advisories fail the PR unless
      # .github/audit-exceptions.json covers them (Issue #460, audit SEC-09)
      - name: Audit production dependencies
        run: node scripts/audit-gate.js

      - name: Setup Environment Variables
        run: |
          echo "NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SANITY_DATASET=production" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SANITY_API_VERSION=2023-05-03" >> $GITHUB_ENV

      - name: Run unit tests with coverage
        run: npm run test:ci
        env:
          CI: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Token required for private repos, optional for public repos
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json,./coverage/lcov.info
          flags: unit,integration
          name: unit-test-coverage
          fail_ci_if_error: false  # Don't fail if Codecov is down
          verbose: true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
