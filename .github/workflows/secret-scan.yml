# ABOUTME: Scans repository for accidentally committed secrets using Gitleaks
name: Secret Scanning

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan for Secrets
    uses: maxrantil/.github/.github/workflows/secret-scan-reusable.yml@0075ab50113bff0183eeefcc15b6968f07df660e # master 2026-11-09
    with:
      gitleaks-version: 'latest'
      fail-on-error: true
