name: Production Deployment

on:
  push:
    branches:
      - master

# Prevent concurrent deployments to the same VPS host.
# If two pushes land within seconds of each other, the second run queues
# rather than racing — avoids the .next.incoming mv race condition (Issue #358).
concurrency:
  group: production-deploy
  cancel-in-progress: false

# Least-privilege GITHUB_TOKEN: deploy only needs to read the repository
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        # A CLI --testPathIgnorePatterns replaces jest.config's list instead of
        # adding to it, so the config's own entries (.claude/ node:test files,
        # node_modules, .next) are repeated here (Issue #456)
        run: npm test -- --testPathIgnorePatterns="/\.claude/|/node_modules/|/\.next/|bundle-size|production-config|bundle-debug|e2e|credential-manager|demo-mode|audit-logger|api-security|performance-security|middleware-security"
      - name: Run middleware build validation
        run: npm test -- tests/build/middleware-compilation.test.ts
      - name: Run type checking
        run: npm run type-check

  # Blocks the deploy on high/critical advisories in production dependencies
  # unless .github/audit-exceptions.json covers them (Issue #460, audit SEC-09)
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # npm audit reads package-lock.json only, so no npm ci (no install scripts run here)
      - name: Audit production dependencies
        run: node scripts/audit-gate.js

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Create build environment
        run: |
          cat > .env.local << EOF
          NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET=production
          NEXT_PUBLIC_SANITY_API_VERSION=2023-05-03
          NEXT_PUBLIC_UMAMI_URL=${{ secrets.NEXT_PUBLIC_UMAMI_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          SECURITY_ENABLED=false
          EOF
      - name: Debug environment variables
        run: |
          echo "🔍 Checking environment variables..."
          echo "NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID:-'NOT SET'}"
          echo "NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:-'NOT SET'}"
          echo "NEXT_PUBLIC_SANITY_API_VERSION: ${NEXT_PUBLIC_SANITY_API_VERSION:-'NOT SET'}"
          echo "NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-'NOT SET'}"
          echo "NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-'NOT SET'}"
          echo "NODE_ENV: ${NODE_ENV:-'NOT SET'}"
          echo "SECURITY_ENABLED: ${SECURITY_ENABLED:-'NOT SET'}"
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: 2023-05-03
          NEXT_PUBLIC_UMAMI_URL: ${{ secrets.NEXT_PUBLIC_UMAMI_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          SECURITY_ENABLED: false
      - name: Build application
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: 2023-05-03
          NEXT_PUBLIC_UMAMI_URL: ${{ secrets.NEXT_PUBLIC_UMAMI_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          SECURITY_ENABLED: false
        run: npm run build
      - name: Verify build output
        run: ls -la .next/
      - name: Create production environment file for tests
        run: |
          cat > .env.production << EOF
          NODE_ENV=production
          NEXT_PUBLIC_APP_ENV=production
          SECURITY_LOGGING_ENABLED=true
          SSE_ENDPOINT_URL=https://idaromme.dk/api/security/events
          NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET=production
          NEXT_PUBLIC_SANITY_API_VERSION=2023-05-03
          EOF
      - name: Run bundle size tests
        run: npm test -- --passWithNoTests tests/performance/bundle-size.test.ts tests/performance/bundle-debug.test.ts __tests__/deployment/production-config.test.js
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-files
          path: .next/
          retention-days: 1
          include-hidden-files: true  # .next/ starts with '.' — must opt-in (Fixes #323)

  deploy:
    runs-on: ubuntu-latest
    needs: [test, security-scan, build]
    if: github.ref == 'refs/heads/master'
    # VULTR_* secrets live in the "production" environment, which only the
    # master branch may use, so workflows on other branches cannot read them.
    environment: production
    steps:
      # Build artifact is already produced and uploaded by the 'build' job.
      # Download it here so we can rsync it to the VPS — no build on VPS (fixes OOM, Issue #320).
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-files
          path: .next/

      - name: Set up SSH key for rsync
        env:
          VULTR_SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ( umask 077; printf '%s\n' "$VULTR_SSH_KEY" > ~/.ssh/deploy_key )

      # Host key verification (Issue #458, audit SEC-07). Both secrets hold the
      # VPS host key checked against the server console, never a same-run
      # ssh-keyscan: VULTR_KNOWN_HOSTS (known_hosts lines, used by rsync) and
      # VULTR_HOST_FINGERPRINT (SHA256 fingerprint, used by appleboy/ssh-action).
      # The deploy stops here if either is missing.
      - name: Configure SSH host verification
        env:
          VULTR_KNOWN_HOSTS: ${{ secrets.VULTR_KNOWN_HOSTS }}
          VULTR_HOST_FINGERPRINT: ${{ secrets.VULTR_HOST_FINGERPRINT }}
        run: |
          if [ -z "$VULTR_KNOWN_HOSTS" ] || [ -z "$VULTR_HOST_FINGERPRINT" ]; then
            echo "::error::VULTR_KNOWN_HOSTS and VULTR_HOST_FINGERPRINT must both be set on the production environment"
            exit 1
          fi
          printf '%s\n' "$VULTR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "SSH_HOST_OPTS=-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Rsync build artifact to VPS staging area
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key $SSH_HOST_OPTS" \
            .next/ \
            ${{ secrets.VULTR_USERNAME }}@${{ secrets.VULTR_HOST }}:/var/www/idaromme.dk/.next.incoming/

      - name: Deploy on VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          # SHA256 host key fingerprint; the verification step above requires it
          fingerprint: ${{ secrets.VULTR_HOST_FINGERPRINT }}
          script: |
            echo "🚀 Starting deployment..."

            # Navigate to project directory
            cd /var/www/idaromme.dk || { echo "❌ Project directory not found"; exit 1; }

            # Node.js comes from /usr/local/bin on the server (installed and
            # pinned by vps-infra), so no version manager is needed here.
            echo "🔍 Node $(node --version), npm $(npm --version)"

            # Abort early if the rsync step did not deliver the artifact.
            # This prevents a deploy that has no rollback path (Issue #320).
            if [ ! -d .next.incoming ]; then
              echo "❌ Build artifact (.next.incoming) not found — aborting"
              exit 1
            fi

            # Check out the commit this run tested and built (public/, config
            # files, package.json, the release script). origin/master could
            # already be a newer commit whose own run has not finished, which
            # paired this build with other source (Issue #493).
            EXPECTED_SHA='${{ github.sha }}'
            echo "📥 Checking out $EXPECTED_SHA..."
            if ! git fetch origin; then
              echo "❌ git fetch failed"
              exit 1
            fi
            if ! git cat-file -e "$EXPECTED_SHA^{commit}" 2>/dev/null; then
              echo "❌ Commit $EXPECTED_SHA is not available on the VPS"
              exit 1
            fi
            if ! git reset --hard "$EXPECTED_SHA"; then
              echo "❌ Could not check out $EXPECTED_SHA"
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
              echo "❌ Checked-out source does not match $EXPECTED_SHA"
              exit 1
            fi

            # Create production environment file
            echo "📝 Setting up production environment..."
            cat > .env.local << EOF
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=production
            NEXT_PUBLIC_SANITY_API_VERSION=2023-05-03
            NEXT_PUBLIC_UMAMI_URL=${{ secrets.NEXT_PUBLIC_UMAMI_URL }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            SECURITY_ENABLED=false
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            EOF
            # .env.local now holds a secret; keep it readable by the deploy user only.
            chmod 600 .env.local

            # Install (only when package-lock.json or Node changed), promote
            # .next.incoming, restart PM2, roll back on failure (Issue #467).
            # Runs from the checked-out commit, so script changes apply at once.
            bash scripts/deploy/vps-release.sh

  production-validation:
    runs-on: ubuntu-24.04
    # Browsers and their system packages come preinstalled, instead of
    # `playwright install --with-deps` on every deploy (Issue #473). The tag must
    # match @playwright/test in package-lock.json (tests/unit/deploy-playwright-container.test.ts)
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    env:
      # Firefox will not start as root with the runner's HOME
      HOME: /root
    needs: [deploy]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # The deploy job only ends after PM2 has started the new build, so the site
      # usually answers at once; poll instead of a fixed sleep (Issue #470)
      - name: Wait for production to answer
        env:
          PRODUCTION_URL: https://idaromme.dk
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 10 --output /dev/null "$PRODUCTION_URL/"; then
              echo "✅ $PRODUCTION_URL answered on attempt $attempt"
              exit 0
            fi
            echo "⏳ $PRODUCTION_URL not answering yet (attempt $attempt/30)"
            sleep 2
          done
          echo "::error::$PRODUCTION_URL did not answer within 30 attempts"
          exit 1
      - name: Run production smoke tests
        env:
          RUN_PRODUCTION_TESTS: 'true'
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: 2023-05-03
          # Analytics is on again: the Issue #263 hotfix in analytics-provider.tsx is removed (Issue #435).
          # Set to 'false' to skip the analytics smoke tests if analytics is ever turned off.
          ANALYTICS_ENABLED: 'true'
        run: npx playwright test tests/e2e/production-smoke.spec.ts --project="Desktop Chrome" --project="Desktop Firefox"
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-smoke-test-results
          path: test-results/
          retention-days: 7
