name: Production Deployment

on:
  push:
    branches:
      - master

# Prevent concurrent deployments to the same VPS host.
# If two pushes land within seconds of each other, the second run queues
# rather than racing — avoids the .next.incoming mv race condition (Issue #358).
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --testPathIgnorePatterns="bundle-size|production-config|bundle-debug|e2e|credential-manager|demo-mode|audit-logger|api-security|performance-security|middleware-security"
      - name: Run middleware build validation
        run: npm test -- tests/build/middleware-compilation.test.ts
      - name: Run type checking
        run: npm run type-check

  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true # Don't block deployment for upstream vulnerabilities
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run security audit
        id: security_audit
        continue-on-error: true
        run: |
          echo "🔍 Running security audit (non-blocking)..."
          npm audit --audit-level high || echo "⚠️ Security vulnerabilities detected - tracked in Issue #45"
      - name: Run dependency check
        continue-on-error: true
        run: npx audit-ci --high || echo "⚠️ Dependency issues detected - tracked in Issue #45"
      - name: Comment on security status
        if: failure()
        run: |
          echo "⚠️ Security scan detected vulnerabilities. These are tracked in Issue #45."
          echo "📝 Deployment will continue as these are upstream dependency issues."
          echo "🔗 See https://github.com/maxrantil/textile-showcase/issues/45 for tracking"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Create build environment
        run: |
          cat > .env.local << EOF
          NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET=production
          NEXT_PUBLIC_SANITY_API_VERSION=2023-05-03
          NEXT_PUBLIC_UMAMI_URL=${{ secrets.NEXT_PUBLIC_UMAMI_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          SECURITY_ENABLED=false
          EOF
      - name: Debug environment variables
        run: |
          echo "🔍 Checking environment variables..."
          echo "NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID:-'NOT SET'}"
          echo "NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:-'NOT SET'}"
          echo "NEXT_PUBLIC_SANITY_API_VERSION: ${NEXT_PUBLIC_SANITY_API_VERSION:-'NOT SET'}"
          echo "NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-'NOT SET'}"
          echo "NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-'NOT SET'}"
          echo "NODE_ENV: ${NODE_ENV:-'NOT SET'}"
          echo "SECURITY_ENABLED: ${SECURITY_ENABLED:-'NOT SET'}"
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: 2023-05-03
          NEXT_PUBLIC_UMAMI_URL: ${{ secrets.NEXT_PUBLIC_UMAMI_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          SECURITY_ENABLED: false
      - name: Build application
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: 2023-05-03
          NEXT_PUBLIC_UMAMI_URL: ${{ secrets.NEXT_PUBLIC_UMAMI_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          SECURITY_ENABLED: false
        run: npm run build
      - name: Verify build output
        run: ls -la .next/
      - name: Create production environment file for tests
        run: |
          cat > .env.production << EOF
          NODE_ENV=production
          NEXT_PUBLIC_APP_ENV=production
          SECURITY_LOGGING_ENABLED=true
          SSE_ENDPOINT_URL=https://idaromme.dk/api/security/events
          NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET=production
          NEXT_PUBLIC_SANITY_API_VERSION=2023-05-03
          EOF
      - name: Run bundle size tests
        run: npm test -- --passWithNoTests tests/performance/bundle-size.test.ts tests/performance/bundle-debug.test.ts __tests__/deployment/production-config.test.js
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: .next/
          retention-days: 1
          include-hidden-files: true  # .next/ starts with '.' — must opt-in (Fixes #323)

  deploy:
    runs-on: ubuntu-latest
    needs: [test, security-scan, build]
    if: github.ref == 'refs/heads/master'
    steps:
      # Build artifact is already produced and uploaded by the 'build' job.
      # Download it here so we can rsync it to the VPS — no build on VPS (fixes OOM, Issue #320).
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: .next/

      - name: Set up SSH key for rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VULTR_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Rsync build artifact to VPS staging area
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            .next/ \
            ${{ secrets.VULTR_USERNAME }}@${{ secrets.VULTR_HOST }}:/var/www/idaromme.dk/.next.incoming/

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          script: |
            echo "🚀 Starting deployment..."

            # Navigate to project directory
            cd /var/www/idaromme.dk || { echo "❌ Project directory not found"; exit 1; }

            # Use Node.js v22 from NVM installation
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
            nvm use 22 || nvm use default
            echo "🔍 Node $(node --version), npm $(npm --version)"

            # Abort early if the rsync step did not deliver the artifact.
            # This prevents a deploy that has no rollback path (Issue #320).
            if [ ! -d .next.incoming ]; then
              echo "❌ Build artifact (.next.incoming) not found — aborting"
              exit 1
            fi

            # Backup current build only if one exists.
            # If there is no .next to back up we set HAS_BACKUP=false so that
            # rollback paths below don't try to restore a non-existent backup.
            if [ -d .next ]; then
              echo "📦 Backing up current build..."
              cp -r .next .next.backup
              HAS_BACKUP=true
            else
              HAS_BACKUP=false
            fi

            # Pull latest source (public/, config files, package.json, etc.)
            echo "📥 Pulling latest changes..."
            git fetch origin
            git reset --hard origin/master

            # Create production environment file
            echo "📝 Setting up production environment..."
            cat > .env.local << EOF
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=production
            NEXT_PUBLIC_SANITY_API_VERSION=2023-05-03
            NEXT_PUBLIC_UMAMI_URL=${{ secrets.NEXT_PUBLIC_UMAMI_URL }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            SECURITY_ENABLED=false
            EOF

            # Stop PM2 before removing node_modules to release file locks (Issue #302).
            echo "⏹️ Stopping PM2 to release node_modules file locks..."
            pm2 stop idaromme-website 2>/dev/null || echo "⚠️ PM2 process not running (ok for first deploy)"

            # Install production dependencies only — no devDependencies, no build.
            # Build already happened on the GHA runner (fixes OOM, Issue #320).
            echo "📦 Installing production dependencies..."
            rm -rf node_modules
            if npm ci --omit=dev; then
              echo "✅ Production dependencies installed"

              # Promote the rsync'd artifact into place
              echo "🔁 Promoting build artifact..."
              rm -rf .next
              mv .next.incoming .next

              # Start/restart PM2
              echo "🔄 Starting application..."
              if pm2 list | grep -q "idaromme-website"; then
                echo "📋 PM2 process exists, restarting..."
                pm2 restart idaromme-website || {
                  echo "❌ PM2 restart failed, rolling back..."
                  rm -rf .next
                  [ "$HAS_BACKUP" = true ] && mv .next.backup .next || echo "⚠️ No backup to restore"
                  pm2 start idaromme-website 2>/dev/null || echo "⚠️ Could not restore PM2 process"
                  exit 1
                }
              else
                echo "🚀 PM2 process not found, starting new instance..."
                PORT=3001 pm2 start npm --name "idaromme-website" -- start
                pm2 save
              fi

              # Cleanup
              rm -rf .next.backup
              echo "🎉 Deployment completed successfully!"
            else
              echo "❌ npm ci failed, rolling back..."
              [ "$HAS_BACKUP" = true ] && pm2 start idaromme-website 2>/dev/null || echo "⚠️ Could not restore PM2 process"
              exit 1
            fi

  production-validation:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium firefox
      - name: Wait for deployment to stabilize
        run: sleep 30
      - name: Run production smoke tests
        env:
          RUN_PRODUCTION_TESTS: 'true'
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: 2023-05-03
          # Analytics disabled: analytics.idaromme.dk server down (Issue #262).
          # Set to 'true' when server is restored and hotfix in analytics-provider.tsx is removed.
          ANALYTICS_ENABLED: 'false'
        run: npx playwright test tests/e2e/production-smoke.spec.ts --project="Desktop Chrome" --project="Desktop Firefox"
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-test-results
          path: test-results/
          retention-days: 7
