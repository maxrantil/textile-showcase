# ABOUTME: GitHub Actions workflow for automated Lighthouse CI performance testing
# Runs on PRs and pushes to master, enforces Lighthouse 98+ score and performance budgets

name: Lighthouse Performance CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'styles/**'
      - 'pages/**'
      - 'components/**'
      - 'utils/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'next.config.ts'
      - 'lighthouserc.js'
      - 'scripts/lighthouse-summary.js'
      - '.github/workflows/lighthouse-ci.yml'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'styles/**'
      - 'pages/**'
      - 'components/**'
      - 'utils/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'next.config.ts'
      - 'lighthouserc.js'
      - 'scripts/lighthouse-summary.js'
      - '.github/workflows/lighthouse-ci.yml'

# Limit concurrent runs to prevent resource conflicts
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip Dependabot PRs - they don't get repository secrets (GitHub security restriction)
    # Dependabot PRs are dependency-only changes tested via unit tests and bundle size checks
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for better caching
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: |
          npm ci --production=false
          npm ls --depth=0

      - name: Setup Environment Variables
        run: |
          echo "NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SANITY_DATASET=production" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SANITY_API_VERSION=2023-05-03" >> $GITHUB_ENV
          echo "NODE_ENV=production" >> $GITHUB_ENV
          echo "CI=true" >> $GITHUB_ENV

      - name: Build Application
        run: |
          echo "Building application for production..."
          npm run build
          echo "Build completed successfully"

      - name: Install Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.12.x
          lhci --version

      - name: Run Lighthouse CI
        continue-on-error: true # Non-blocking per Issue #48 - performance issues tracked in Issue #47
        run: |
          echo "Starting Lighthouse CI audit..."
          echo "Using configuration from lighthouserc.js"
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          NODE_ENV: production

      - name: Upload Lighthouse Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results-${{ github.sha }}
          path: |
            ./lighthouse-results/
            ./.lighthouseci/
          retention-days: 30

      - name: Performance Budget Check
        continue-on-error: true # Non-blocking per Issue #48 - performance issues tracked in Issue #47
        run: |
          echo "Checking performance budget compliance..."

          # Check if lighthouse results exist
          if [ ! -d "./lighthouse-results" ]; then
            echo "❌ No Lighthouse results found"
            exit 1
          fi

          # Parse results and check performance scores
          node -e "
            const fs = require('fs');
            const path = require('path');

            const resultsDir = './lighthouse-results';
            if (!fs.existsSync(resultsDir)) {
              console.log('❌ Results directory not found');
              process.exit(1);
            }

            const files = fs.readdirSync(resultsDir)
              .filter(f => f.endsWith('.json'))
              .map(f => path.join(resultsDir, f));

            if (files.length === 0) {
              console.log('❌ No JSON result files found');
              process.exit(1);
            }

            let allPassed = true;
            const results = [];

            files.forEach(file => {
              try {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                // lhci also writes manifest.json; only Lighthouse reports count
                if (typeof data.lighthouseVersion !== 'string') return;
                const url = data.finalUrl || data.requestedUrl || 'Unknown URL';

                // A missing score means Lighthouse could not measure the page:
                // report why instead of treating it as 0%
                if (typeof data.categories?.performance?.score !== 'number') {
                  const lcpError = data.audits?.['largest-contentful-paint']?.errorMessage;
                  const reason = data.runtimeError?.message || lcpError || 'unknown reason';
                  console.log(\`❌ No performance score for \${url.replace('http://localhost:3000', '') || '/'}: \${reason}\`);
                  allPassed = false;
                  return;
                }
                const performanceScore = data.categories?.performance?.score * 100 || 0;
                const accessibilityScore = data.categories?.accessibility?.score * 100 || 0;
                const bestPracticesScore = data.categories?.['best-practices']?.score * 100 || 0;
                const seoScore = data.categories?.seo?.score * 100 || 0;

                // Core Web Vitals
                const lcp = data.audits?.['largest-contentful-paint']?.numericValue || 0;
                const fcp = data.audits?.['first-contentful-paint']?.numericValue || 0;
                const cls = data.audits?.['cumulative-layout-shift']?.numericValue || 0;
                const tbt = data.audits?.['total-blocking-time']?.numericValue || 0;
                const si = data.audits?.['speed-index']?.numericValue || 0;

                const result = {
                  url: url.replace('http://localhost:3000', ''),
                  performance: Math.round(performanceScore),
                  accessibility: Math.round(accessibilityScore),
                  bestPractices: Math.round(bestPracticesScore),
                  seo: Math.round(seoScore),
                  lcp: Math.round(lcp),
                  fcp: Math.round(fcp),
                  cls: Math.round(cls * 1000) / 1000,
                  tbt: Math.round(tbt),
                  si: Math.round(si)
                };

                results.push(result);

                // EMERGENCY: Check thresholds aligned with lighthouserc.js (Issue #39)
                if (performanceScore < 70) {
                  console.log(\`❌ Performance score below 70%: \${result.performance}% for \${result.url || 'homepage'}\`);
                  allPassed = false;
                }

                if (lcp > 3000) {
                  console.log(\`❌ LCP above 3.0s: \${lcp}ms for \${result.url || 'homepage'}\`);
                  allPassed = false;
                }

                if (fcp > 2500) {
                  console.log(\`❌ FCP above 2.5s: \${fcp}ms for \${result.url || 'homepage'}\`);
                  allPassed = false;
                }

                if (cls > 0.2) {
                  console.log(\`❌ CLS above 0.2: \${cls} for \${result.url || 'homepage'}\`);
                  allPassed = false;
                }

              } catch (err) {
                console.log(\`❌ Error parsing \${file}: \${err.message}\`);
                allPassed = false;
              }
            });

            // Display results table
            console.log('\\n📊 Lighthouse Performance Results:');
            console.log('┌─────────────────────────────────────────────────────────────────────────────┐');
            console.log('│ URL                    │ Perf │ A11y │ BP   │ SEO  │ LCP  │ FCP  │ CLS  │ TBT │');
            console.log('├─────────────────────────────────────────────────────────────────────────────┤');

            results.forEach(r => {
              const url = (r.url || '/').padEnd(22).substring(0, 22);
              const perf = r.performance.toString().padStart(4);
              const a11y = r.accessibility.toString().padStart(4);
              const bp = r.bestPractices.toString().padStart(4);
              const seo = r.seo.toString().padStart(4);
              const lcp = (r.lcp + 'ms').padStart(4);
              const fcp = (r.fcp + 'ms').padStart(4);
              const cls = r.cls.toString().padStart(4);
              const tbt = (r.tbt + 'ms').padStart(3);

              console.log(\`│ \${url} │ \${perf} │ \${a11y} │ \${bp} │ \${seo} │ \${lcp} │ \${fcp} │ \${cls} │ \${tbt} │\`);
            });

            console.log('└─────────────────────────────────────────────────────────────────────────────┘');

            if (allPassed) {
              console.log('\\n✅ All performance budgets passed!');
              console.log('   🎯 Lighthouse score: 70+ (emergency threshold)');
              console.log('   ⚡ LCP: <3.0s (emergency threshold)');
              console.log('   🚀 FCP: <2.5s (emergency threshold)');
              console.log('   📐 CLS: <0.2 (emergency threshold)');
            } else {
              console.log('\\n❌ Performance budget violations detected');
              console.log('   Please review the failing metrics above and optimize accordingly.');
              process.exit(1);
            }
          "

      - name: Comment Performance Results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Shared, unit-tested summary (scripts/lighthouse-summary.js):
            // skips lhci's manifest.json and reports missing metrics as n/a
            // with Lighthouse's reason instead of 0
            const { isLighthouseReport, summarizeReport, formatMarkdown } =
              require(`${process.env.GITHUB_WORKSPACE}/scripts/lighthouse-summary.js`);

            const resultsDir = './lighthouse-results';
            const results = [];

            if (fs.existsSync(resultsDir)) {
              for (const f of fs.readdirSync(resultsDir).filter(f => f.endsWith('.json'))) {
                const file = path.join(resultsDir, f);
                try {
                  const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                  if (isLighthouseReport(data)) results.push(summarizeReport(data));
                } catch (err) {
                  console.log('Error parsing:', file, err.message);
                }
              }
            }

            const body =
              formatMarkdown(results) +
              '\n---\n*This report was generated by Lighthouse CI in GitHub Actions*';

            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Check Performance Regression
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking for performance regressions..."

          # This would compare against baseline results in a production setup
          # For now, we ensure minimum thresholds are met
          echo "✅ Performance regression check completed"
          echo "   (In production, this would compare against baseline metrics)"
